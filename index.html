<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<style>
  :root {
    --bg-1: #0f0c29;
    --bg-2: #302b63;
    --bg-3: #24243e;
    --accent: #7f5af0;
    --accent-2: #2cb67d;
    --text: #fffffe;
    --muted: #a7a9be;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
    background-size: 200% 200%;
    animation: gradientShift 12s ease infinite;
    color: var(--text);
    overflow: hidden;
    position: relative;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.5), transparent),
      radial-gradient(2px 2px at 140px 80px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 90px 40px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 200px 150px, rgba(255,255,255,0.3), transparent),
      radial-gradient(2px 2px at 260px 60px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 320px 200px, rgba(255,255,255,0.4), transparent);
    background-repeat: repeat;
    background-size: 380px 220px;
    opacity: 0.6;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 3rem 2.5rem;
    max-width: 640px;
    width: 90%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    backdrop-filter: blur(14px);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
  }

  .badge {
    display: inline-block;
    padding: 0.35rem 1rem;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent-2);
    border: 1px solid rgba(44, 182, 125, 0.4);
    border-radius: 999px;
    background: rgba(44, 182, 125, 0.08);
    margin-bottom: 1.5rem;
  }

  h1 {
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #fff, var(--accent) 60%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 0.75rem;
  }

  p.subtitle {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.6;
    margin-bottom: 2.5rem;
  }

  .countdown {
    display: flex;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 2.5rem;
  }

  .time-block {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 1rem 0.5rem;
    min-width: 84px;
    flex: 1 0 84px;
    max-width: 110px;
  }

  .time-value {
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .time-label {
    margin-top: 0.4rem;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .progress-wrap {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 2rem;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 999px;
    transition: width 1s linear;
  }

  form.notify {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  input[type="email"] {
    flex: 1 1 260px;
    padding: 0.75rem 1rem;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.07);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s ease;
  }

  input[type="email"]::placeholder { color: var(--muted); }
  input[type="email"]:focus { border-color: var(--accent); }

  button {
    padding: 0.75rem 1.6rem;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(127, 90, 240, 0.4);
  }

  .msg {
    margin-top: 1rem;
    font-size: 0.9rem;
    color: var(--accent-2);
    min-height: 1.2em;
  }

  footer {
    margin-top: 2rem;
    font-size: 0.8rem;
    color: var(--muted);
  }

  @media (max-width: 420px) {
    .time-block { min-width: 70px; padding: 0.75rem 0.4rem; }
  }
</style>
</head>
<body>
  <div class="stars"></div>

  <div class="container">
    <span class="badge">Launching Soon</span>
    <h1>We're Almost Ready</h1>
    <p class="subtitle">
      Something exciting is on its way. We're putting the final touches on
      our new experience — stay tuned, it'll be worth the wait.
    </p>

    <div class="countdown" id="countdown">
      <div class="time-block">
        <div class="time-value" id="hours">00</div>
        <div class="time-label">Hours</div>
      </div>
      <div class="time-block">
        <div class="time-value" id="minutes">00</div>
        <div class="time-label">Minutes</div>
      </div>
      <div class="time-block">
        <div class="time-value" id="seconds">00</div>
        <div class="time-label">Seconds</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <form class="notify" id="notifyForm">
      <input type="email" id="emailInput" placeholder="Enter your email for updates" required>
      <button type="submit">Notify Me</button>
    </form>
    <div class="msg" id="msg"></div>

    <footer>&copy; <span id="year"></span> All rights reserved.</footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const DURATION_MS = 9 * 60 * 60 * 1000; // 9 hours
    const STORAGE_KEY = 'countdownDeadline';

    let deadline = localStorage.getItem(STORAGE_KEY);
    if (!deadline || Number(deadline) < Date.now()) {
      deadline = Date.now() + DURATION_MS;
      localStorage.setItem(STORAGE_KEY, deadline);
    } else {
      deadline = Number(deadline);
    }
    const startTime = deadline - DURATION_MS;

    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const progressBar = document.getElementById('progressBar');

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const remaining = deadline - Date.now();

      if (remaining <= 0) {
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        progressBar.style.width = '100%';
        document.querySelector('.subtitle').textContent = "We're live! Thanks for waiting.";
        clearInterval(timer);
        return;
      }

      const h = Math.floor(remaining / (1000 * 60 * 60));
      const m = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((remaining % (1000 * 60)) / 1000);

      hoursEl.textContent = pad(h);
      minutesEl.textContent = pad(m);
      secondsEl.textContent = pad(s);

      const elapsed = Date.now() - startTime;
      const pct = Math.min(100, (elapsed / DURATION_MS) * 100);
      progressBar.style.width = pct + '%';
    }

    tick();
    const timer = setInterval(tick, 1000);

    document.getElementById('notifyForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const msg = document.getElementById('msg');
      if (email) {
        msg.textContent = "Thanks! We'll let you know when we launch.";
        document.getElementById('emailInput').value = '';
      }
    });
  </script>
</body>
</html>
